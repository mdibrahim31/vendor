<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub Vendor - Login & Register</title>
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        /* Pure CSS Tab Switching logic */
        #tab-register:checked ~ .auth-forms #register-form { display: block; }
        #tab-register:checked ~ .auth-forms #login-form { display: none; }
        #tab-login:checked ~ .auth-forms #login-form { display: block; }
        #tab-login:checked ~ .auth-forms #register-form { display: none; }

        #tab-login:checked ~ .tab-buttons label[for="tab-login"] {
            border-bottom: 2px solid #f97316; color: #f97316; font-weight: 600;
        }
        #tab-register:checked ~ .tab-buttons label[for="tab-register"] {
            border-bottom: 2px solid #f97316; color: #f97316; font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Main Container Card -->
    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl overflow-hidden p-8">
        
        <!-- Brand Logo / Title -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-orange-500 flex items-center justify-center gap-2">
                🍔 FoodHub <span class="text-xs bg-orange-100 text-orange-600 px-2.5 py-1 rounded-full font-medium">Vendor</span>
            </h1>
            <p class="text-gray-500 text-sm mt-2">Manage your restaurant and orders easily</p>
        </div>

        <!-- Hidden Radio Inputs for Tab Control -->
        <input type="radio" name="auth-tab" id="tab-login" checked class="hidden">
        <input type="radio" name="auth-tab" id="tab-register" class="hidden">

        <!-- Tab Header Buttons -->
        <div class="tab-buttons flex border-b mb-6 text-gray-500">
            <label for="tab-login" class="w-1/2 text-center pb-3 cursor-pointer transition hover:text-orange-500 font-medium">Login</label>
            <label for="tab-register" class="w-1/2 text-center pb-3 cursor-pointer transition hover:text-orange-500 font-medium">Register</label>
        </div>

        <!-- Forms Container -->
        <div class="auth-forms">

            <!-- 1. LOGIN FORM -->
            <div id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                    <input type="tel" placeholder="Enter your mobile number" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-orange-500 bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" placeholder="Enter your password" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-orange-500 bg-gray-50">
                </div>
                <button type="button" onclick="alert('Login button clicked! (Backend integration pending)')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-orange-500/30 cursor-pointer mt-2">
                    Login to Dashboard
                </button>
            </div>

            <!-- 2. REGISTER FORM -->
            <div id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Restaurant Name</label>
                    <input type="text" placeholder="e.g. Burger King" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-orange-500 bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                    <input type="tel" placeholder="Enter mobile number" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-orange-500 bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" placeholder="Create a password" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-orange-500 bg-gray-50">
                </div>
                <button type="button" onclick="alert('Registration button clicked! (Backend integration pending)')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-orange-500/30 cursor-pointer mt-2">
                    Register Restaurant
                </button>
            </div>

        </div>

    </div>

</body>
</html>
