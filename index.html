<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Vendor Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md mx-4">
        <h1 class="text-3xl font-bold text-orange-500 text-center mb-2">FoodHub</h1>
        <p class="text-gray-500 text-center mb-6">Vendor Login Portal</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                <!-- id="loginPhone" etai JavaScript-er sathe connect thakbe -->
                <input type="text" id="loginPhone" placeholder="Enter mobile number" class="w-full px-4 py-3 rounded-xl border focus:outline-orange-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <!-- id="loginPassword" etai JavaScript-er sathe connect thakbe -->
                <input type="password" id="loginPassword" placeholder="Enter password" class="w-full px-4 py-3 rounded-xl border focus:outline-orange-500">
            </div>
            <!-- onclick="handleLogin()" diye JavaScript function call kora hocche -->
            <button onclick="handleLogin()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-orange-500/30">
                Login to Dashboard
            </button>
        </div>
    </div>

    <!-- Supabase JS & Index JS link -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="index.js"></script>
</body>
</html>
