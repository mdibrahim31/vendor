<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Vendor & Restaurant Portal</title>
    <!-- Google Fonts, Tailwind CSS & Supabase JS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Navigation Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-500 flex items-center gap-2">
                <i data-lucide="store"></i> FoodHub Vendor Portal
            </h1>
            <div class="flex items-center gap-3">
                <button onclick="switchTab('orders')" id="btnOrders" class="bg-orange-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-md">Live Orders</button>
                <button onclick="switchTab('manage')" id="btnManage" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-semibold transition">Manage Menu & Shop</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- ================= SECTION 1: LIVE ORDERS ================= -->
        <div id="ordersSection" class="animate-fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Incoming Customer Orders</h2>
                <button onclick="fetchOrders()" class="bg-orange-50 hover:bg-orange-100 text-orange-600 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1.5 transition">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh
                </button>
            </div>
            <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- ================= SECTION 2: MANAGE RESTAURANT & MENU ================= -->
        <div id="manageSection" class="hidden animate-fade-in">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Restaurant & Menu Management</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Register Restaurant Form -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border">
                    <h3 class="text-xl font-bold mb-4 text-orange-500 flex items-center gap-2">
                        <i data-lucide="plus-circle"></i> Register Restaurant
                    </h3>
                    <form id="restaurantForm" onsubmit="handleRegisterRestaurant(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Restaurant Name</label>
                            <input type="text" id="vName" required placeholder="e.g. Burger King" class="w-full px-4 py-2.5 rounded-xl border text-sm focus:outline-orange-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Category</label>
                            <select id="vCategory" class="w-full px-4 py-2.5 rounded-xl border text-sm focus:outline-orange-500">
                                <option value="Fast Food">Fast Food</option>
                                <option value="Italian">Italian</option>
                                <option value="Desi">Desi / Local</option>
                                <option value="Dessert">Dessert</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Restaurant Cover Image</label>
                            <input type="file" id="vImageFile" accept="image/*" required class="w-full px-3 py-2 rounded-xl border text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100">
                        </div>
                        <button type="submit" id="btnSaveRes" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-orange-500/30">Save Restaurant</button>
                    </form>
                </div>

                <!-- Add Menu Item Form -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border">
                    <h3 class="text-xl font-bold mb-4 text-orange-500 flex items-center gap-2">
                        <i data-lucide="utensils-crossed"></i> Add Food Menu Item
                    </h3>
                    <form id="menuForm" onsubmit="handleAddMenu(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Select Restaurant</label>
                            <select id="mRestaurantId" required class="w-full px-4 py-2.5 rounded-xl border text-sm focus:outline-orange-500">
                                <option value="">Loading restaurants...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Food Name</label>
                            <input type="text" id="mName" required placeholder="e.g. Cheese Burger" class="w-full px-4 py-2.5 rounded-xl border text-sm focus:outline-orange-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-sm font-medium mb-1">Price ($)</label>
                                <input type="number" step="0.01" id="mPrice" required placeholder="8.99" class="w-full px-4 py-2.5 rounded-xl border text-sm focus:outline-orange-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Boosted Deal?</label>
                                <select id="mBoosted" class="w-full px-4 py-2.5 rounded-xl border text-sm focus:outline-orange-500">
                                    <option value="false">No</option>
                                    <option value="true">Yes</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Food Image</label>
                            <input type="file" id="mImageFile" accept="image/*" required class="w-full px-3 py-2 rounded-xl border text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100">
                        </div>
                        <button type="submit" id="btnSaveMenu" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-orange-500/30">Add Food Item</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm mt-10">
        <p>&copy; 2026 FoodHub Vendor Dashboard. All rights reserved.</p>
    </footer>

    <!-- Script Application Logic -->
    <script>
        // Supabase Initialization (Apnar credentials ekhane bosaben)
        const SUPABASE_URL = 'https://kdqyompkfmnocpihfzdj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkcXlvbXBrZm1ub2NwaWhmemRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDkxOTIsImV4cCI6MjEwNDg4NTE5Mn0.4gmwMruyf54ZdXAADEAa9noLZD5JMFyLOzrszUIMVns';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        lucide.createIcons();

        function switchTab(tab) {
            const ordersSection = document.getElementById('ordersSection');
            const manageSection = document.getElementById('manageSection');
            const btnOrders = document.getElementById('btnOrders');
            const btnManage = document.getElementById('btnManage');

            if(tab === 'orders') {
                ordersSection.classList.remove('hidden');
                manageSection.classList.add('hidden');
                btnOrders.className = "bg-orange-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-md";
                btnManage.className = "bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-semibold transition";
                fetchOrders();
            } else {
                ordersSection.classList.add('hidden');
                manageSection.classList.remove('hidden');
                btnManage.className = "bg-orange-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-md";
                btnOrders.className = "bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-semibold transition";
                loadRestaurantDropdown();
            }
        }

        // Helper function to upload image file to Supabase Storage
        async function uploadImageToSupabase(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput.files || fileInput.files.length === 0) return null;

            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36.substring(2, 7))}.${fileExt}`;
            const filePath = `vendor_uploads/${fileName}`;

            const { data, error } = await supabaseClient.storage
                .from('images')
                .upload(filePath, file);

            if (error) {
                throw new Error("Image upload failed: " + error.message);
            }

            // Get Public URL
            const { data: publicURLData } = supabaseClient.storage
                .from('images')
                getPublicUrl(filePath); // corrected call syntax below
            
            // Standard publicUrl retrieval
            const publicUrl = supabaseClient.storage.from('images').getPublicUrl(filePath).data.publicUrl;
            return publicUrl;
        }

        // Fetch Live Orders
        async function fetchOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10">Loading orders...</p>`;

            try {
                const { data, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                container.innerHTML = '';
                if (!data || data.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">No orders received yet.</p>`;
                    return;
                }

                data.forEach(order => {
                    let itemsHtml = '';
                    if(Array.isArray(order.items)) {
                        order.items.forEach(item => {
                            itemsHtml += `<li class="text-xs text-gray-600">• ${item.name} (x${item.qty}) - $${(item.price * item.qty).toFixed(2)}</li>`;
                        });
                    }

                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <span class="text-xs bg-orange-100 text-orange-600 px-2.5 py-1 rounded-full font-semibold">Order #${order.id}</span>
                                    <span class="text-xs text-gray-400">${new Date(order.created_at).toLocaleTimeString()}</span>
                                </div>
                                <h4 class="font-bold text-gray-800 text-base mb-1">${order.customer_name}</h4>
                                <p class="text-xs text-blue-600 font-medium mb-2">📞 ${order.mobile}</p>
                                <p class="text-xs text-gray-600 mb-2">📍 ${order.address}</p>
                                <div class="bg-gray-50 p-3 rounded-xl mb-4">
                                    <p class="text-xs font-bold text-gray-700 mb-1">Ordered Items:</p>
                                    <ul class="space-y-1">${itemsHtml}</ul>
                                </div>
                            </div>
                            <div class="border-t pt-3 flex justify-between items-center">
                                <span class="font-bold text-gray-800">Total: $${parseFloat(order.total_amount).toFixed(2)}</span>
                                <span class="text-xs bg-yellow-100 text-yellow-700 px-2.5 py-1 rounded-full font-bold">${order.status || 'Pending'}</span>
                            </div>
                        </div>
                    `;
                });
                lucide.createIcons();
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="col-span-full text-center text-red-500 py-10">Failed to load orders.</p>`;
            }
        }

        async function loadRestaurantDropdown() {
            const { data } = await supabaseClient.from('restaurants').select('*');
            const select = document.getElementById('mRestaurantId');
            select.innerHTML = '';
            if(!data || data.length === 0) {
                select.innerHTML = `<option value="">Please register a restaurant first</option>`;
                return;
            }
            data.forEach(res => {
                select.innerHTML += `<option value="${res.id}">${res.name}</option>`;
            });
        }

        async function handleRegisterRestaurant(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSaveRes');
            btn.innerText = "Uploading & Saving...";
            btn.disabled = true;

            try {
                const name = document.getElementById('vName').value;
                const category = document.getElementById('vCategory').value;
                const image = await uploadImageToSupabase('vImageFile');

                const { error } = await supabaseClient.from('restaurants').insert([{ name, category, image, rating: 5.0 }]);
                if(error) throw error;

                alert("Restaurant Registered Successfully!");
                document.getElementById('restaurantForm').reset();
                loadRestaurantDropdown();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.innerText = "Save Restaurant";
                btn.disabled = false;
            }
        }

        async function handleAddMenu(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSaveMenu');
            btn.innerText = "Uploading Image...";
            btn.disabled = true;

            try {
                const restaurant_id = parseInt(document.getElementById('mRestaurantId').value);
                const name = document.getElementById('mName').value;
                const price = parseFloat(document.getElementById('mPrice').value);
                const is_boosted = document.getElementById('mBoosted').value === 'true';
                const image_url = await uploadImageToSupabase('mImageFile');

                const { data: resData } = await supabaseClient.from('restaurants').select('name').eq('id', restaurant_id).single();
                const restaurant_name = resData ? resData.name : '';

                const { error } = await supabaseClient.from('menus').insert([{ restaurant_id, restaurant_name, name, price, is_boosted, image_url }]);
                if(error) throw error;

                alert("Menu Item Added Successfully!");
                document.getElementById('menuForm').reset();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.innerText = "Add Food Item";
                btn.disabled = false;
            }
        }

        fetchOrders();
    </script>
</body>
</html>
