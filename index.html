<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Vendor Login Portal</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="login-card">
        <div class="logo-text">FoodHub</div>
        <div class="subtitle">Vendor Login Portal</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="phone" placeholder="Enter mobile number" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Login to Dashboard</button>
            <p id="error-msg">Invalid mobile number or password!</p>
        </form>
    </div>

    <!-- JS File Link (defer use kora hoyeche jate HTML load howar por script kaj kore) -->
    <script src="login.js" defer></script>

</body>
</html>
