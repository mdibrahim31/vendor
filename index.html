<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Vendor Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen px-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-orange-500 mb-2">FoodHub</h2>
        <p class="text-center text-gray-500 mb-6 text-sm">Vendor Login Portal</p>
        
        <!-- Login Form Only -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Mobile Number</label>
                <input type="tel" id="loginPhone" placeholder="Enter your mobile number" class="w-full px-4 py-3 rounded-xl border text-sm focus:outline-orange-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" class="w-full px-4 py-3 rounded-xl border text-sm focus:outline-orange-500">
            </div>
            <button type="button" onclick="handleLogin()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-orange-500/30">Login to Dashboard</button>
        </div>
    </div>

    <!-- External JavaScript File -->
    <script src="login.js"></script>
</body>
</html>
