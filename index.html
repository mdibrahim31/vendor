<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Vendor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-35">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-500 flex items-center gap-2">
                <i data-lucide="store"></i> FoodHub Vendor Portal
            </h1>
            <div id="authHeaderBtn"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-10 flex-grow w-full">

        <!-- 1. AUTH SECTION (Login & Register) -->
        <div id="authSection" class="bg-white p-8 rounded-2xl shadow-md max-w-md mx-auto">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-center text-gray-800">Vendor Login</h2>
            
            <div id="registerFields" class="space-y-4 mb-4 hidden">
                <input type="text" id="regName" placeholder="Store / Restaurant Name" class="w-full px-4 py-3 rounded-xl border focus:outline-orange-500">
                <input type="text" id="regAddress" placeholder="Address" class="w-full px-4 py-3 rounded-xl border focus:outline-orange-500">
                <input type="text" id="regTypes" placeholder="Food Type (e.g. Fast Food, Desi)" class="w-full px-4 py-3 rounded-xl border focus:outline-orange-500">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Profile Image</label>
                    <input type="file" id="regProfileImage" class="w-full text-sm border p-2 rounded-xl">
                </div>
            </div>

            <div class="space-y-4">
                <input type="text" id="authPhone" placeholder="Phone Number" class="w-full px-4 py-3 rounded-xl border focus:outline-orange-500">
                <input type="password" id="authPassword" placeholder="Password" class="w-full px-4 py-3 rounded-xl border focus:outline-orange-500">
                
                <button onclick="handleAuthAction()" id="authSubmitBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-orange-500/30">
                    Login
                </button>
            </div>

            <p class="text-center text-sm mt-6 text-gray-500">
                <span id="authToggleText">Don't have an account?</span> 
                <button onclick="toggleAuthMode()" class="text-orange-500 font-semibold hover:underline ml-1" id="authToggleBtn">Register here</button>
            </p>
        </div>

        <!-- 2. DASHBOARD SECTION (Hidden Initially) -->
        <div id="dashboardSection" class="hidden space-y-8">
            <!-- Vendor Info Card -->
            <div class="bg-white p-6 rounded-2xl shadow-md flex items-center gap-6">
                <img id="vendorProfilePreview" src="" class="w-24 h-24 rounded-2xl object-cover border">
                <div>
                    <h3 id="vendorNameDisplay" class="text-2xl font-bold text-gray-800"></h3>
                    <p id="vendorAddressDisplay" class="text-gray-500 text-sm mt-1"></p>
                    <span id="vendorTypeDisplay" class="inline-block mt-2 text-xs bg-orange-100 text-orange-600 px-3 py-1 rounded-full font-semibold"></span>
                </div>
            </div>

            <!-- Add Menu Item Section -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="plus-circle"></i> Add New Menu Item</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="menuName" placeholder="Item Name" class="px-4 py-3 rounded-xl border focus:outline-orange-500">
                    <input type="number" id="menuPrice" placeholder="Price ($)" class="px-4 py-3 rounded-xl border focus:outline-orange-500">
                    <input type="text" id="menuCategory" placeholder="Category (e.g. Burger, Pizza)" class="px-4 py-3 rounded-xl border focus:outline-orange-500">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Item Image</label>
                        <input type="file" id="menuImage" class="w-full text-sm border p-2 rounded-xl">
                    </div>
                </div>
                <textarea id="menuDesc" placeholder="Description (Optional)" class="w-full mt-4 px-4 py-3 rounded-xl border focus:outline-orange-500"></textarea>
                <button onclick="addMenuItem()" class="mt-4 bg-orange-500 hover:bg-orange-600 text-white font-semibold px-6 py-3 rounded-xl transition shadow-md">
                    Upload Menu Item
                </button>
            </div>

            <!-- My Menu List -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
                <h3 class="text-xl font-bold mb-4">My Uploaded Menus</h3>
                <div id="vendorMenuList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 FoodHub Vendor Portal. All rights reserved.</p>
    </footer>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = 'https://kdqyompkfmnocpihfzdj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkcXlvbXBrZm1ub2NwaWhmemRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDkxOTIsImV4cCI6MjEwNDg4NTE5Mn0.4gmwMruyf54ZdXAADEAa9noLZD5JMFyLOzrszUIMVns';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isRegisterMode = false;
        let loggedInVendor = null;

        lucide.createIcons();

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const regFields = document.getElementById('registerFields');
            const authTitle = document.getElementById('authTitle');
            const authSubmitBtn = document.getElementById('authSubmitBtn');
            const authToggleText = document.getElementById('authToggleText');
            const authToggleBtn = document.getElementById('authToggleBtn');

            if(isRegisterMode) {
                regFields.classList.remove('hidden');
                authTitle.innerText = "Vendor Registration";
                authSubmitBtn.innerText = "Register";
                authToggleText.innerText = "Already have an account?";
                authToggleBtn.innerText = "Login here";
            } else {
                regFields.classList.add('hidden');
                authTitle.innerText = "Vendor Login";
                authSubmitBtn.innerText = "Login";
                authToggleText.innerText = "Don't have an account?";
                authToggleBtn.innerText = "Register here";
            }
        }

        async function handleAuthAction() {
            const phone = document.getElementById('authPhone').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if(!phone || !password) {
                alert("Please fill in phone and password!");
                return;
            }

            if(isRegisterMode) {
                // REGISTRATION
                const name = document.getElementById('regName').value.trim();
                const address = document.getElementById('regAddress').value.trim();
                const types = document.getElementById('regTypes').value.trim();
                const profileImgFile = document.getElementById('regProfileImage').files[0];

                if(!name) { alert("Store name is required!"); return; }

                // ফোল্ডারের নাম সুন্দর ও নিরাপদ করার জন্য স্পেস এবং স্পেশাল ক্যারেক্টার বাদ দিয়ে লোয়ারকেস করা হলো
                const folderName = name.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
                let profileImageUrl = "";

                if(profileImgFile) {
                    const filePath = `${folderName}/profile_${Date.now()}_${profileImgFile.name}`;
                    const { error: uploadError } = await supabaseClient.storage.from('images').upload(filePath, profileImgFile);
                    
                    if(uploadError) {
                        alert("Image upload failed: " + uploadError.message);
                        return;
                    }

                    const { data: urlData } = supabaseClient.storage.from('images').getPublicUrl(filePath);
                    profileImageUrl = urlData.publicUrl;
                }

                // டேটাবেজে সেভ করা
                const { error: insertError } = await supabaseClient.from('vendors').insert([{
                    name, address, phone, types, profile_image_url: profileImageUrl
                }]);

                if(insertError) {
                    alert("Registration failed: " + insertError.message);
                    return;
                }

                alert("Registration successful! Please login.");
                toggleAuthMode();

            } else {
                // LOGIN
                const { data, error } = await supabaseClient.from('vendors').select('*').eq('phone', phone).single();
                
                if(error || !data) {
                    alert("Invalid phone number or vendor not found!");
                    return;
                }

                loggedInVendor = data;
                loadDashboard();
            }
        }

        function loadDashboard() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            
            document.getElementById('authHeaderBtn').innerHTML = `
                <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl font-medium text-sm flex items-center gap-1">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            `;

            document.getElementById('vendorNameDisplay').innerText = loggedInVendor.name;
            document.getElementById('vendorAddressDisplay').innerText = loggedInVendor.address || "No address provided";
            document.getElementById('vendorTypeDisplay').innerText = loggedInVendor.types || "General";
            document.getElementById('vendorProfilePreview').src = loggedInVendor.profile_image_url || 'https://images.unsplash.com/photo-1552566626-52f8b828add9';

            fetchVendorMenus();
            lucide.createIcons();
        }

        function logout() {
            loggedInVendor = null;
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('authHeaderBtn').innerHTML = '';
        }

        async function addMenuItem() {
            const name = document.getElementById('menuName').value.trim();
            const price = parseFloat(document.getElementById('menuPrice').value);
            const category = document.getElementById('menuCategory').value.trim();
            const description = document.getElementById('menuDesc').value.trim();
            const imageFile = document.getElementById('menuImage').files[0];

            if(!name || isNaN(price)) {
                alert("Item name and valid price are required!");
                return;
            }

            let imageUrl = "";

            // ভেন্ডরের নাম অনুসারেই ফোল্ডার পাথ তৈরি করা হচ্ছে (যেমন: burger_king/menu_...)
            const folderName = loggedInVendor.name.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();

            if(imageFile) {
                const filePath = `${folderName}/menu_${Date.now()}_${imageFile.name}`;
                const { error: uploadError } = await supabaseClient.storage.from('images').upload(filePath, imageFile);
                
                if(uploadError) {
                    alert("Image upload failed: " + uploadError.message);
                    return;
                }

                const { data: urlData } = supabaseClient.storage.from('images').getPublicUrl(filePath);
                imageUrl = urlData.publicUrl;
            }

            const { error: menuError } = await supabaseClient.from('menus').insert([{
                vendor_id: loggedInVendor.id,
                name: name,
                price: price,
                category: category,
                description: description,
                image_url: imageUrl
            }]);

            if(menuError) {
                alert("Error adding menu: " + menuError.message);
            } else {
                alert("✅ Menu item added successfully!");
                document.getElementById('menuName').value = '';
                document.getElementById('menuPrice').value = '';
                document.getElementById('menuCategory').value = '';
                document.getElementById('menuDesc').value = '';
                document.getElementById('menuImage').value = '';
                fetchVendorMenus();
            }
        }

        async function fetchVendorMenus() {
            const { data, error } = await supabaseClient.from('menus').select('*').eq('vendor_id', loggedInVendor.id);
            const container = document.getElementById('vendorMenuList');
            container.innerHTML = '';

            if(error || !data || data.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-400 py-6">No menu items added yet.</p>`;
                return;
            }

            data.forEach(item => {
                container.innerHTML += `
                    <div class="bg-gray-50 p-4 rounded-xl flex items-center gap-4 border">
                        <img src="${item.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'}" class="w-16 h-16 rounded-lg object-cover">
                        <div class="flex-grow">
                            <h5 class="font-bold text-sm">${item.name}</h5>
                            <p class="text-orange-500 font-semibold text-sm">$${item.price}</p>
                            <span class="text-xs text-gray-400">${item.category || 'General'}</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
