<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Vendor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-md py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-orange-500">FoodHub Dashboard</h1>
        <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-xl transition">
            Logout
        </button>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
        
        <!-- 1. Shop Information & Status Section -->
        <div class="bg-white p-6 rounded-2xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Shop Information & Settings</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Shop Name</label>
                    <input type="text" id="shopName" class="w-full px-4 py-2 rounded-xl border focus:outline-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Mobile Number</label>
                    <input type="text" id="shopPhone" class="w-full px-4 py-2 rounded-xl border bg-gray-50" readonly>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Address</label>
                    <input type="text" id="shopAddress" class="w-full px-4 py-2 rounded-xl border focus:outline-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Cuisine / Types</label>
                    <input type="text" id="shopTypes" placeholder="e.g. Fast Food, Biryani" class="w-full px-4 py-2 rounded-xl border focus:outline-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Discount (%)</label>
                    <input type="number" id="shopDiscount" class="w-full px-4 py-2 rounded-xl border focus:outline-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Profile Image URL</label>
                    <input type="text" id="shopImage" class="w-full px-4 py-2 rounded-xl border focus:outline-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Latitude</label>
                    <input type="number" step="any" id="shopLat" class="w-full px-4 py-2 rounded-xl border focus:outline-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Longitude</label>
                    <input type="number" step="any" id="shopLong" class="w-full px-4 py-2 rounded-xl border focus:outline-orange-500">
                </div>
            </div>

            <!-- Toggles (Status & Boost) -->
            <div class="flex flex-wrap gap-6 items-center border-t pt-4 mb-4">
                <label class="flex items-center cursor-pointer">
                    <span class="mr-3 font-medium text-gray-700">Shop Status (Open/Close):</span>
                    <input type="checkbox" id="shopStatusToggle" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500 relative"></div>
                </label>

                <label class="flex items-center cursor-pointer">
                    <span class="mr-3 font-medium text-gray-700">Boost Status:</span>
                    <input type="checkbox" id="shopBoostToggle" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500 relative"></div>
                </label>
            </div>

            <button onclick="updateVendorInfo()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition">
                Save Shop Changes
            </button>
        </div>

        <!-- 2. Menu Section (Upload / Manage Food Items) -->
        <div class="bg-white p-6 rounded-2xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Upload Food Item / Menu</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <input type="text" id="foodName" placeholder="Food Name" class="px-4 py-2 rounded-xl border focus:outline-orange-500">
                <input type="number" id="foodPrice" placeholder="Price (Tk)" class="px-4 py-2 rounded-xl border focus:outline-orange-500">
                <input type="text" id="foodImage" placeholder="Food Image URL" class="px-4 py-2 rounded-xl border focus:outline-orange-500">
            </div>
            <button onclick="addFoodItem()" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition">
                Add to Menu
            </button>
            
            <div class="mt-6">
                <h3 class="font-bold text-gray-700 mb-2">My Menu List</h3>
                <div id="menuListContainer" class="space-y-2">
                    <!-- Dynamic Menu Items will load here -->
                    <p class="text-gray-500 text-sm">Loading menu...</p>
                </div>
            </div>
        </div>

        <!-- 3. Order Section -->
        <div class="bg-white p-6 rounded-2xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Incoming Orders</h2>
            <div id="ordersContainer" class="space-y-3">
                <!-- Dynamic Orders will load here -->
                <p class="text-gray-500 text-sm">No new orders found.</p>
            </div>
        </div>

    </main>

    <!-- Supabase CDN & Dashboard Logic JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="home.js"></script>
</body>
</html>
